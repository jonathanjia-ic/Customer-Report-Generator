name: manually add a comment

env:
  COMMENT: "Hi there!"
  PR_ID: 1

on:
  workflow_dispatch:

jobs:
  
  create_comment:
    runs-on: ubuntu-latest
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
      - name: add comment
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          issue-number: ${{ env.PR_ID }}
          body: $${{ env.COMMENT }}
