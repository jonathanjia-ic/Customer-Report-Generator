output_dir: ./output
log_level: INFO

sources:
  core_banking:
    dsn_env: CORE_BANKING_DSN
    timeout_seconds: 30
  crm:
    dsn_env: CRM_DSN
    timeout_seconds: 30
  marketing_data_warehouse:
    account_env: MDW_ACCOUNT
    warehouse_env: MDW_WAREHOUSE

reports:
  melbourne-metro:
    scheduled: true
    cadence: weekly
    format: xlsx
    audience: VIC Retail Regional Managers
  sydney-metro:
    scheduled: true
    cadence: weekly
    format: xlsx
    audience: NSW Retail Regional Managers
  home-loan-portfolio:
    scheduled: true
    cadence: monthly
    format: xlsx
    audience: Mortgages Product Team
