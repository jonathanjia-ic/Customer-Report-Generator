output_dir: ./output
log_level: INFO

sources:
  primary:
    dsn_env: PRIMARY_DSN
    timeout_seconds: 30
  secondary:
    dsn_env: SECONDARY_DSN
    timeout_seconds: 30
  archive:
    account_env: ARCHIVE_ACCOUNT
    warehouse_env: ARCHIVE_WAREHOUSE

views:
  region-north:
    scheduled: true
    cadence: weekly
    format: xlsx
  site:
    scheduled: true
    cadence: weekly
    format: xlsx
  tagged:
    scheduled: true
    cadence: monthly
    format: xlsx
  active:
    scheduled: true
    cadence: daily
    format: csv
