[project]
name = "region-based-customer-reporting"
version = "1.4.2"
description = "Internal region based customer reporting"
requires-python = ">=3.10"
authors = [{ name = "Customer Insights", email = "customer-insights@example.internal" }]
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "Jinja2>=3.1",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
report-generator = "report_generator.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
